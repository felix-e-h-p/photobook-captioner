[settings]
# Every label in this dataset is >= 0.55.
min_label_confidence = 0.5
# Roughly one strong, specific label on the page.
page_threshold = 1.0
# Session scores are means over many photos, so diluted.
context_threshold = 0.4
# Best session occasion must beat the runner-up by this much.
context_margin = 0.2
# What counts as the same session when borrowing an occasion.
context_window_hours = 6
# Page evidence this strong wins even if the session disagrees.
page_override_threshold = 3.0

[[occasion]]
name = "Beach day"
setting = "outdoor"
date_style = "month"
use_place = true
seasons = ["spring", "summer", "autumn"]
core = ["Beach", "Shoreline", "Coast", "Sand", "Sandcastle", "Surfing"]
blocked_by = ["Snow", "Winter", "Piste", "Skiing", "Snowboarding"]
evidence = { Beach = 3, Shoreline = 2, Coast = 2, Sand = 2, Sea = 1.5, Ocean = 1.5, Swimwear = 1.5, Bikini = 1.5, Surfing = 3, Sandcastle = 3 }

