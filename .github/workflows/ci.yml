name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov=captioner --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: photobook-captioner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the API
        run: |
          docker run -d --name api -p 8000:8000 photobook-captioner:ci
          for _ in $(seq 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api
          exit 1
      - name: Runs as a non-root user
        run: test "$(docker exec api whoami)" = captioner
      - name: Captions an uploaded photo
        run: |
          docker exec api python -c "from PIL import Image; Image.new('RGB', (8, 8)).save('/tmp/blank.jpg')"
          docker cp api:/tmp/blank.jpg blank.jpg
          curl -sf -F photos=@blank.jpg localhost:8000/caption | tee caption.json
          grep -q '"caption":"Memories"' caption.json
