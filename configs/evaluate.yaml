data_dir: data

# template or llm
writer: template

# Let pages borrow the occasion from other photos in the same session.
use_context: true

# random or consecutive pages
mode: random

page_sizes: [1, 2, 3]
pages_per_size: 30

# Drop near-duplicate photos before sampling, so same evidence isn't counted twice.
remove_duplicates: true

seed: 0
home_country: GB

# Folder name infers occasion it should get. null means no single occasion (scored separately).
expected:
  day-at-beach: Beach day
  garden-birthday-party: Birthday party
  skiing-holiday: Skiing
  summer-with-grandkids: null

# Larger local model that scores each caption 1-5. Needs Ollama with the model pulled.
judge:
  enabled: false
  model: llama3.1:8b

# Image-text similarity. Needs the clip dependency group.
clip:
  enabled: false
  model: ViT-B-32
  pretrained: laion2b_s34b_b79k

mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  experiment: caption-evaluation

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/hydra/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
